<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MARCA — el mundo de SUBJECT</title>
  <meta name="description" content="Desplázate para volar a través del mundo de MARCA." />
  <style>
    /* Tema del motor. Iguala al fondo de las escenas generadas. */
    :root, .sw-root {
      --sw-bg: #F5EDE0;          /* == color de fondo de la escena */
      --sw-ink: #241d2b;
      --sw-ink-soft: #6a6072;
      --sw-accent: #9B7EBD;      /* los accents por sección lo sobreescriben */
    }
  </style>
</head>
<body>
  <div id="top"></div>
  <div id="world"></div>

  <script src="scrub-engine.js"></script>
  <script>
    mountScrollWorld(document.getElementById('world'), {
      brand: { name: 'MARCA', href: '#top' },
      cta: { label: 'Pedir ahora', href: '#finale' },
      hint: 'desplázate para volar',
      diveScroll: 1.3,
      connScroll: 0.9,
      sections: [
        {
          id: 'sceneA', label: 'Escena A',
          still: 'assets/sceneA-poster.webp',
          clip: 'assets/vid/sceneA.mp4',
          clipMobile: 'assets/vid/sceneA-m.mp4',
          stillMobile: 'assets/sceneA-m-poster.webp',
          accent: '#8FB98A',
          eyebrow: 'Propuesta de valor',
          title: 'La línea heroica.',
          body: 'Una oración sencilla sobre esta etapa.',
          tags: ['Prueba', 'Prueba', 'Prueba'],
        },
        {
          id: 'finale', label: 'El Producto',
          still: 'assets/finale-poster.webp',
          clip: 'assets/vid/finale.mp4',
          clipMobile: 'assets/vid/finale-m.mp4',
          stillMobile: 'assets/finale-m-poster.webp',
          accent: '#9B7EBD',
          eyebrow: 'Y todo converge en',
          title: 'Una cosa perfecta.',
          body: 'La oración de payoff.',
          tags: [],
          cta: {
            primary: { label: 'Empezar', href: '#' },
            secondary: { label: 'Ver más', href: '#' },
          },
        },
      ],
      // Longitud === sections.length - 1. Usa null para crossfade directo.
      connectors: [
        null,
        // 'assets/vid/conn1.mp4',
      ],
      connectorsMobile: [
        null,
        // 'assets/vid/conn1-m.mp4',
      ],
    });
  </script>
</body>
</html>
