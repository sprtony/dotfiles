<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Connector Mobile</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #root { width: 100%; height: 100%; position: relative; overflow: hidden; }
    .layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 40%; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="{{COMPOSITION_ID}}" data-start="0" data-width="1080" data-height="1920" data-duration="{{DURATION}}">
    <img class="layer layer-next" src="{{NEXT_STILL}}" alt="" />
    <img class="layer layer-current" src="{{CURRENT_STILL}}" alt="" />
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const dur = parseFloat('{{DURATION}}');
      const current = document.querySelector('.layer-current');
      const next = document.querySelector('.layer-next');

      const tl = gsap.timeline({ paused: true });
      tl.fromTo(current,
        { scale: 1.08, y: 0, opacity: 1 },
        { scale: 1.28, y: '-16vh', opacity: 0, duration: dur, ease: 'power2.inOut' },
        0
      );
      tl.fromTo(next,
        { scale: 1.28, y: '16vh', opacity: 0 },
        { scale: 1.08, y: 0, opacity: 1, duration: dur, ease: 'power2.inOut' },
        0
      );

      window.__timelines['{{COMPOSITION_ID}}'] = tl;
    });
  </script>
</body>
</html>
