<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Scene Desktop</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #root { width: 100%; height: 100%; position: relative; overflow: hidden; }
    .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 42%; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="{{COMPOSITION_ID}}" data-start="0" data-width="1920" data-height="1080" data-duration="{{DURATION}}">
    <img class="bg" src="{{STILL_PATH}}" alt="" />
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const motion = '{{CAMERA_MOTION}}';
      const bg = document.querySelector('.bg');
      let from, to;

      if (motion === 'pan') {
        from = { scale: 1.08, x: '12vw' };
        to = { scale: 1.08, x: '-12vw' };
      } else if (motion === 'journey') {
        from = { scale: 1.12, x: '8vw' };
        to = { scale: 1.22, x: '-10vw' };
      } else { // zoom
        from = { scale: 1, x: 0, y: 0 };
        to = { scale: 1.25, x: '-4vw', y: '-2vh' };
      }

      to.duration = parseFloat('{{DURATION}}');
      to.ease = 'power1.inOut';

      const tl = gsap.timeline({ paused: true });
      tl.fromTo(bg, from, to);
      window.__timelines['{{COMPOSITION_ID}}'] = tl;
    });
  </script>
</body>
</html>
