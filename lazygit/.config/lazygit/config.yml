gui:
  showIcons: true
  theme:
    activeBorderColor:
      - '#89b4fa'
      - bold
    inactiveBorderColor:
      - '#a6adc8'
    optionsTextColor:
      - '#89b4fa'
    selectedLineBgColor:
      - '#313244'
    cherryPickedCommitBgColor:
      - '#45475a'
    cherryPickedCommitFgColor:
      - '#89b4fa'
    unstagedChangesColor:
      - '#f38ba8'
    defaultFgColor:
      - '#cdd6f4'
    searchingActiveBorderColor:
      - '#f9e2af'
customCommands:
  - key: "<c-f>"
    context: "global"
    description: "upload files to ftp"
    prompts:
      - type: "menu"
        title: "What action do you do?"
        options:
          - name: "push"
            description: "push commits"
            value: "push"
          - name: "catchup"
            description: "sync last commit"
            value: "catchup"
    command: "git ftp {{index .PromptResponses 0}}"
git:
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never
